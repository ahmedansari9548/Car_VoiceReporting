services:

  postgres:
    image: postgres:17
    container_name: pakwheels-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pakwheels_voice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: pakwheels-api
    depends_on:
      - postgres
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data: